[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "flashinfer-cubin"
version = "0.6.17"
description = "Compatibility shim for stock vLLM images using FlashInfer 0.6.17 JIT assets"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/flashinfer_cubin"]
