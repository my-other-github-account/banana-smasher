[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "banana-smasher"
version = "1.0.0"
description = "Fail-closed bs-pack tooling and shared serving loader"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.3.5",
  "safetensors==0.8.0",
  "scipy==1.16.1",
  "setuptools==80.9.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.12.7", "scipy==1.16.1"]
knapsack = ["scipy==1.16.1"]
solve = [
  "torch==2.8.0",
  "triton==3.4.0; platform_system == 'Linux'",
]

[project.scripts]
smash = "banana_smasher.cli:main"

[project.entry-points."banana_smasher.update_backends"]
physical-repair = "banana_smasher.update_backends.physical_repair:run_physical_repair"
periodic-qtip3 = "banana_smasher.qtip3_fixed:run_qtip3_fixed_update"

[tool.hatch.build.targets.wheel]
packages = ["src/banana_smasher"]

[tool.hatch.build.targets.wheel.force-include]
"BANANA_PACK_SPEC.md" = "banana_smasher/BANANA_PACK_SPEC.md"
"PACK_FORMAT.md" = "banana_smasher/PACK_FORMAT.md"
"README.md" = "banana_smasher/README.md"
"ANCHOR_EVALUATION.md" = "banana_smasher/ANCHOR_EVALUATION.md"
"schema" = "banana_smasher/schema"
"anchor_banks" = "banana_smasher/anchor_banks"
"producer_configs" = "banana_smasher/producer_configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
