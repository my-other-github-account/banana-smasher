[build-system]
requires = ["setuptools>=77", "torch==2.11.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-smasher-plugin"
version = "0.2.0"
description = "Stock-vLLM banana_smasher runtime plugin for native-plane packs"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.3.5",
    "quack-kernels>=0.4.1,<0.5.1",
    "safetensors==0.8.0",
]

[project.entry-points."vllm.general_plugins"]
banana_smasher_plugin = "banana_smasher_plugin:register"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
banana_smasher_plugin = [
    "*.json",
    "*.npy",
    "csrc/*.cu",
    "csrc/qtip/*.cu",
    "csrc/qtip/*.cpp",
    "csrc/qtip/*.h",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
