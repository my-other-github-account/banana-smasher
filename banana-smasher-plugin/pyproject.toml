[build-system]
requires = ["setuptools>=77,<82", "torch==2.11.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-smasher-plugin"
version = "0.2.5"
description = "Stock-vLLM banana_smasher runtime plugin for native-plane packs"
requires-python = ">=3.10"
dependencies = [
    "banana-smasher @ https://github.com/my-other-github-account/banana-smasher/releases/download/v0.2.5-sm121-runtime/banana_smasher-1.0.1-py3-none-any.whl#sha256=caec226f077bcdcc0ce4a54ba8dec5d57ec58a6ea46fd9e76b3f86840966ccb4",
    "deep-gemm @ https://github.com/my-other-github-account/banana-smasher/releases/download/v0.2.0-sm121-runtime/deep_gemm-2.6.1-cp312-cp312-linux_aarch64.whl#sha256=da52fe2ed4e3d0dfac528df0836e3450ea9412a5e000b250ca47b1fcb7cf466b ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-cubin @ https://github.com/my-other-github-account/banana-smasher/releases/download/v0.2.5-sm121-runtime/flashinfer_cubin-0.6.12%2Bbanana.617-py3-none-any.whl#sha256=1e823e03cfd55f092db1819fdf6823ffedfd1f3fff26b8f2d733de0304985904 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-jit-cache @ https://github.com/my-other-github-account/banana-smasher/releases/download/v0.2.0-sm121-runtime/flashinfer_jit_cache-0.6.17%2Bcu130-cp39-abi3-manylinux_2_28_aarch64.whl#sha256=2a87e17231d0fc3a8fb1692f6dfca866c562641c31e26967da91bdea51cd2c4a ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-python @ https://github.com/my-other-github-account/banana-smasher/releases/download/v0.2.5-sm121-runtime/flashinfer_python-0.6.12%2Bbanana.617-py3-none-any.whl#sha256=4d4002b1ac04fefc2ae02697110b2ef749a771bfa2d7172788cd6d1217d891ed ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "numpy>=2.0,<2.3",
    "quack-kernels>=0.4.1,<0.5.1",
    "safetensors==0.8.0",
]

[project.entry-points."vllm.general_plugins"]
banana_smasher_plugin = "banana_smasher_plugin:register"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
banana_smasher_plugin = [
    "*.json",
    "*.npy",
    "csrc/*.cu",
    "csrc/qtip/*.cu",
    "csrc/qtip/*.cpp",
    "csrc/qtip/*.h",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
