[build-system]
requires = ["setuptools>=77,<82", "torch==2.11.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-smasher-plugin"
version = "0.2.4"
description = "Stock-vLLM banana_smasher runtime plugin for native-plane packs"
requires-python = ">=3.10"
dependencies = [
    "banana-smasher @ https://github.com/my-other-github-account/banana-smasher/releases/download/v0.2.1-sm121-runtime/banana_smasher-1.0.0-py3-none-any.whl#sha256=6ec9809e92eef4e45c327f1be0502ba4ef6fe04ba6edd95811c78b6ec68ae801",
    "deep-gemm @ https://github.com/my-other-github-account/banana-smasher/releases/download/v0.2.0-sm121-runtime/deep_gemm-2.6.1-cp312-cp312-linux_aarch64.whl#sha256=da52fe2ed4e3d0dfac528df0836e3450ea9412a5e000b250ca47b1fcb7cf466b ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-cubin @ https://github.com/my-other-github-account/banana-smasher/releases/download/v0.2.4-sm121-runtime/flashinfer_cubin-0.6.12%2Bbanana.fi0617-py3-none-any.whl#sha256=b8d72cbe119f0f8d2d3cc116d4580bca6f77d0355bc24de9db82d6f8d76ddf6a ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-jit-cache @ https://github.com/my-other-github-account/banana-smasher/releases/download/v0.2.0-sm121-runtime/flashinfer_jit_cache-0.6.17%2Bcu130-cp39-abi3-manylinux_2_28_aarch64.whl#sha256=2a87e17231d0fc3a8fb1692f6dfca866c562641c31e26967da91bdea51cd2c4a ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-python @ https://github.com/my-other-github-account/banana-smasher/releases/download/v0.2.4-sm121-runtime/flashinfer_python-0.6.12%2Bbanana.fi0617-py3-none-any.whl#sha256=cf46d8f7549d8ce84fd65d01b2bb06e1204eaac7da889a22518ac84f6c01ae9a ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "numpy==2.2.6",
    "quack-kernels>=0.4.1,<0.5.1",
    "safetensors==0.8.0",
]

[project.entry-points."vllm.general_plugins"]
banana_smasher_plugin = "banana_smasher_plugin:register"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
banana_smasher_plugin = [
    "*.json",
    "*.npy",
    "csrc/*.cu",
    "csrc/qtip/*.cu",
    "csrc/qtip/*.cpp",
    "csrc/qtip/*.h",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
